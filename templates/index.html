<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Care Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef3ff, #f7f8fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chatbot {
            width: 100%;
            max-width: 850px;
            height: 700px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #334155;
            color: #fff;
            padding: 22px 25px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            opacity: .9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #fafbfe;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bot .bubble {
            background: #e8edf5;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background: #334155;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 13px 15px;
            font-size: 15px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #334155;
        }

        #sendButton {
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            background: #334155;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1e293b;
        }

        #sendButton:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .typing {
            color: #64748b;
            font-style: italic;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chatbot {
                height: 100vh;
                border-radius: 0;
            }

            .bubble {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>
    <main class="chatbot">
        <header class="header">
            <h1>🐾 Pet Care Assistant</h1>
            <p>Ask questions related to this chatbot's topic.</p>
        </header>

        <section class="messages" id="messages">
            <div class="message bot">
                <div class="bubble">
                    Hello! I'm your Pet Care Assistant. Ask me a question related to my topic and I'll help you learn.
                </div>
            </div>
        </section>

        <form class="input-area" id="chatForm">
            <input
                id="messageInput"
                type="text"
                placeholder="Ask a question..."
                autocomplete="off"
                required
            >
            <button id="sendButton" type="submit">Send</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            message.appendChild(bubble);
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;

            return message;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            input.disabled = true;
            sendButton.disabled = true;

            const typingMessage = addMessage("Thinking...", "bot");
            typingMessage.querySelector(".bubble").classList.add("typing");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                typingMessage.remove();

                if (!response.ok) {
                    addMessage(data.error || "Something went wrong.", "bot");
                    return;
                }

                addMessage(data.reply, "bot");
            } catch (error) {
                typingMessage.remove();
                addMessage(
                    "Sorry, I couldn't connect to the chatbot. Please try again.",
                    "bot"
                );
            } finally {
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
